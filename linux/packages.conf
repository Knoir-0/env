# ==============================================================================
# Linux Package Manifest
# ==============================================================================
# Sourced by linux/setup_linux.sh. Each entry is: id|display_name|description
# Cross-platform CLI tools (mise, kubectl, ripgrep, ...) are NOT listed here;
# they come from ../shared/Brewfile via Homebrew on Linux. Node.js, Java, and
# Python versions are managed by mise (../shared/mise.toml).
# ==============================================================================

# GUI applications installed from Flathub (user installation).
FLATPAK_PACKAGES=(
    "org.raspberrypi.rpi-imager|Raspberry Pi Imager|Official utility to flash and preconfigure Raspberry Pi OS images"
    "com.visualstudio.code|Visual Studio Code|Extensible code editor from Microsoft"
    "io.github.shiftey.Desktop|GitHub Desktop|Official GitHub Desktop client (Linux community fork)"
    "org.mozilla.firefox|Firefox|Mozilla Firefox web browser"
    "org.freecad.FreeCAD|FreeCAD|Parametric 3D CAD modeler"
    "com.orcaslicer.OrcaSlicer|OrcaSlicer|Open-source slicer for 3D printers"
    "org.blender.Blender|Blender|Free and open-source 3D creation suite"
    "org.libreoffice.LibreOffice|LibreOffice|Free and open-source office productivity suite"
    "io.beekeeperstudio.Studio|Beekeeper Studio|Modern SQL editor and database manager"
    "rest.insomnia.Insomnia|Insomnia|Lightweight REST, GraphQL, and gRPC API client"
    "app.freelens.Freelens|Freelens|Open-source Kubernetes IDE (community fork of OpenLens)"
)

# GUI applications installed as official AppImages into ~/Applications.
APPIMAGE_PACKAGES=(
    "cursor|Cursor|AI-first code editor built on VS Code"
    "antigravity|Antigravity|Google Antigravity agent orchestration platform"
)

# CLI tools installed from the host distro package manager.
DISTRO_PACKAGES=(
    "git|Git|Distributed version control system"
    "git-lfs|Git LFS|Git extension for versioning large files"
)

# Special-case installers that are neither Flatpak nor AppImage.
SPECIAL_PACKAGES=(
    "docker-engine|Docker Engine|Docker Engine, CLI, Buildx, and Compose plugin"
    "ollama|Ollama|Local large language model runner and CLI"
)

# macOS-only Brewfile casks with no Linux equivalent in this setup.
SKIPPED_PACKAGES=(
    "maccy|Maccy|macOS-only clipboard manager"
    "scroll-reverser|Scroll Reverser|macOS-only independent scroll utility"
    "caffeine|Caffeine|macOS-only stay-awake menu bar utility"
)
